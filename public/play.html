<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psicología General Challenge · Alumno</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:650px"><div class="tag">MODO PARTICIPANTE</div><h1>Psicología General Challenge</h1><p id="status" class="muted">Conectando…</p><section id="login" class="panel"><h2>Entra a la partida</h2><label>Código de sala</label><input id="code" maxlength="6" inputmode="numeric"><br><br><label>Tu nombre</label><input id="name" maxlength="32" placeholder="Nombre y apellido"><br><br><button id="join">Participar</button><p id="error" style="color:#ffbd9e"></p></section><section id="waiting" class="panel hidden"><h2>¡Estás dentro!</h2><p>Espera a que tu docente inicie o avance la actividad.</p><h3 id="score"></h3></section><section id="game" class="panel hidden"><div class="row"><span id="round" class="pill"></span><span id="counter" class="pill"></span></div><h2 id="question"></h2><div id="answers" class="grid"></div><p id="feedback" class="muted"></p><h3 id="score2"></h3></section><section id="end" class="panel hidden"><h2>¡Terminaste!</h2><h3 id="finalscore"></h3><p>Gracias por participar. Observa la clasificación final en la pantalla de tu docente.</p></section></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id);let code=new URLSearchParams(location.search).get('code')||'',token='',name='',st=null;const saved=JSON.parse(localStorage.getItem('abaStudent')||'null');$('code').value=code;function show(id){['login','waiting','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function join(){code=$('code').value.trim();name=$('name').value.trim();s.emit('join',{code,name,token},r=>{if(!r.ok){$('error').textContent=r.error;return}token=r.token;localStorage.setItem('abaStudent',JSON.stringify({code,token,name}));$('error').textContent='';show('waiting')})}function draw(x){if(x.code!==code||!token)return;st=x;let me=x.players.find(p=>p.name===name);if(!me)return;let score=me.score;if(x.phase==='done'){show('end');$('finalscore').textContent='Tu puntuación: '+score}else if(x.phase==='lobby'){show('waiting');$('score').textContent='Puntos: '+score}else{show('game');$('round').textContent=x.round;$('counter').textContent=(x.index+1)+' / '+x.count;$('question').textContent=x.question.q;$('score2').textContent='Puntos: '+score;let key='abaAnswered_'+code+'_'+x.index;let answered=sessionStorage.getItem(key);$('answers').innerHTML='';x.question.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='answer';b.textContent='ABCD'[i]+'. '+opt;if(x.phase==='results'&&i===x.answer)b.classList.add('correct');if(x.phase==='results'&&answered===String(i)&&i!==x.answer)b.classList.add('wrong');b.disabled=x.phase!=='question'||answered!==null;b.onclick=()=>s.emit('vote',{code,token,option:i},r=>{if(r.ok){sessionStorage.setItem(key,String(i));draw(st)}});$('answers').append(b)});$('feedback').textContent=x.phase==='results'?('Respuesta correcta: '+ 'ABCD'[x.answer]+'. '+x.why):answered!==null?'Respuesta registrada. Espera los resultados.':'Selecciona una sola respuesta.'}}
s.on('connect',()=>{$('status').textContent='Conectado';if(saved&&saved.code===code){token=saved.token;name=saved.name;$('name').value=name;s.emit('join',{code,token,name},r=>{if(!r.ok){token='';show('login')}})}});s.on('disconnect',()=>{$('status').textContent='Reconectando…'});s.on('state',draw);$('join').onclick=join;
</script></body></html>
